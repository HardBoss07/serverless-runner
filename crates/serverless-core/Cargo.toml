[package]
name = "serverless-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Database & Async
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-native-tls", "postgres", "macros", "chrono", "uuid"] }
tokio = { version = "1.50", features = ["full"] }

# Error Handling (Standard for production Rust)
thiserror = "2.0.18"

# HTTP response integration for AppError
axum = "0.8"
serde_json = "1.0"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.10", features = ["serde", "v4"] }

# Environment
dotenvy = "0.15.7"