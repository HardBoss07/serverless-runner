[package]
name = "serverless-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
# Internal Workspace Dependency
serverless-core = { path = "../serverless-core" }

# Web Framework
axum = "0.8.8"
tokio = { version = "1.50", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }

# WebAssembly Runtime (The Star of the Show)
wasmtime = "43"
wasmtime-wasi = "43"

# Utilities
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"