[package]
name = "serverless-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
# Internal Workspace Dependency
serverless-core = { path = "../serverless-core" }

# Re-used from core for types exposed in signatures
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-native-tls", "postgres"] }

# Web Framework
axum = "0.8.8"
tokio = { version = "1.50", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }

# WebAssembly Runtime (The Star of the Show)
wasmtime = { version = "26.0.0", features = ["async"] }
wasmtime-wasi = { version = "26.0.0", features = ["preview1"] }

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }

# Environment loading
dotenvy = "0.15.7"