services:
  db:
    image: postgres:16-alpine
    container_name: serverless_db
    restart: always
    environment:
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: platform_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Healthcheck ensures your Rust app doesn't try to connect before Postgres is ready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: